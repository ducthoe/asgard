[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asgard-fus"
version = "3.0.0"
description = "Samsung Firmware Update Server client"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "ducthoe" }]
dependencies = [
    "indexed-gzip>=1.10.3",
    "lz4>=4.3.2",
    "pycryptodomex>=3.20.0",
    "requests>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/ducthoe/asgard"
Source = "https://github.com/ducthoe/asgard"
Issues = "https://github.com/ducthoe/asgard/issues"

[project.scripts]
asgard = "asgard.cli:main"

[tool.setuptools.packages.find]
include = ["asgard", "asgard.*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["A", "FA100", "FA102", "I"]

[tool.ruff.format]
quote-style = "double"
